<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealLens | Transaction intelligence</title>
<style>
:root{--ink:#182c3d;--muted:#617482;--line:#dce4e8;--paper:#fff;--bg:#f3f6f8;--blue:#125c76;--orange:#a45713}
*{box-sizing:border-box}body{font:15px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--bg);margin:0}header{background:#112d3c;color:#fff;padding:24px 5%;display:flex;align-items:center;gap:24px}header h1{font-size:26px;margin:0;letter-spacing:-1px}header small{color:#adc4cf}header select{margin-left:auto;max-width:330px}main{max-width:1380px;margin:auto;padding:30px 4%}h2{font-size:27px;font-weight:600;letter-spacing:-.6px;margin:5px 0 10px}h3{font-size:18px}p{max-width:1000px}button,select,input{font:inherit;padding:9px 13px;border:1px solid #ccd8df;border-radius:5px;background:#fff;color:var(--ink)}button{cursor:pointer}button.active,button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:25px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.metric{background:white;border:1px solid var(--line);padding:20px}.metric strong{display:block;font-size:30px;font-weight:600}.panel{background:white;border:1px solid var(--line);padding:24px;margin:20px 0;overflow:auto}.tag{display:inline-block;padding:2px 9px;border-radius:4px;background:#e5eff3;color:var(--blue);font-size:12px}.tag.warn{background:#fff0dd;color:var(--orange)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:12px 10px}th{color:var(--muted);font-weight:600;background:#f6f8fa}details{margin:12px 0;border-bottom:1px solid var(--line);padding-bottom:12px}summary{cursor:pointer;font-weight:600}blockquote{margin:12px 0;padding:0 15px;border-left:3px solid #a8c5d2;font-size:14px;white-space:pre-wrap}code{font-size:12px;word-break:break-all}a{color:var(--blue)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.notice{border-left:3px solid #b27331;padding-left:16px;color:#73502b}.hidden{display:none}#question{flex:1;min-width:250px}.num{text-align:right;font-variant-numeric:tabular-nums}.scroll{max-height:650px;overflow:auto}footer{margin-top:40px;color:var(--muted);font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}header{flex-wrap:wrap}header select{margin-left:0}main{padding:20px}h2{font-size:23px}}
</style></head><body>
<header><div><h1>DealLens</h1><small>TRANSACTION & HEDGING INTELLIGENCE</small></div><select id="deal" aria-label="Transaction"></select><button id="refresh" title="Load the latest completed run">Refresh run</button></header>
<main><nav id="tabs"></nav><div id="content" aria-live="polite">Loading research run...</div><footer id="footer"></footer></main>
<script>
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=x=>esc(String(x).replaceAll('_',' '));const fmt=x=>x==null?'—':Number(x).toLocaleString(undefined,{maximumFractionDigits:0});
let bundle,manifest,active='Overview';const tabs=['Overview','Evidence','Comparison','Timeline','Analytics','Ask DealLens'];
const badge=(x,w=false)=>`<span class="tag ${w?'warn':''}">${pretty(x)}</span>`;
function evidence(r){return `<details><summary>${pretty(r.field_name)} · ${esc(r.document_layer)} · page ${esc(r.page)} ${badge(r.status,r.status!=='supported')}</summary><p>${esc(r.section)} · ${badge(r.review_status,r.review_status!=='verified')}</p><p>Value: <code>${esc(JSON.stringify(r.normalized_value))}</code> · Candidate: <code>${esc(JSON.stringify(r.candidate_value??null))}</code></p><p>Record <code>${esc(r.record_id)}</code> · Reviewer: ${esc(r.reviewer)}</p>${r.agent_assessment?`<p class="notice"><strong>Agent source check — not human verification:</strong> ${esc(r.agent_assessment.assessment)} Original PDF pages: ${r.agent_assessment.physical_pdf_pages.map(p=>`<a target="_blank" rel="noopener" href="/source/${encodeURIComponent(bundle.document.document_id)}#page=${p}">${p}</a>`).join(", ")}</p>`:""}<blockquote>${esc(r.evidence)}</blockquote>${(r.evidence_sources||[]).slice(1).map(s=>`<blockquote>Page ${esc(s.page)}: ${esc(s.evidence)}</blockquote>`).join('')}<p><a target="_blank" rel="noopener" href="/source/${encodeURIComponent(bundle.document.document_id)}#page=${r.page}">Open original PDF at page ${r.page}</a></p><code>${esc(r.locator)}</code></details>`}
async function load(){bundle=await(await fetch('/api/'+encodeURIComponent(document.querySelector('#deal').value))).json();manifest=bundle.run_manifest;render()}
function render(){document.querySelector('#tabs').innerHTML=tabs.map(t=>`<button class="${active===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{active=e.dataset.tab;render()});const d=bundle.document,m=bundle.metrics;let html='';
if(active==='Overview'){html=`<p class="muted">PUBLIC SOURCE RESEARCH / ${pretty(d.role)}</p><h2>${pretty(d.document_id)}</h2><p>${badge(d.transaction_type)} ${badge('human review pending',true)}</p><p>Trace source provisions through extraction, comparison and financing sensitivities. This run uses deterministic rules; complex provisions remain in the review queue.</p><div class="grid"><div class="metric"><span>Source pages</span><strong>${m.page_count}</strong></div><div class="metric"><span>Supported field types</span><strong>${m.machine_supported_fields} / ${m.catalog_fields}</strong></div><div class="metric"><span>Human verified records</span><strong>${m.human_verified_records}</strong></div><div class="metric"><span>Run time</span><strong>${m.elapsed_seconds}s</strong></div></div><div class="panel"><h3>Source and controls</h3><p><a target="_blank" href="/source/${encodeURIComponent(d.document_id)}">Open original PDF</a> · Filing date: ${esc(d.filing_date)} (${esc(d.filing_date_status)})</p><p>SHA-256 <code>${esc(d.sha256)}</code></p><p>Ingested ${esc(d.ingested_at)}</p>${d.warnings.map(w=>`<p class="notice">${pretty(w.type)}${w.page?' · page '+w.page:''}: ${esc(w.action||'Inspect source')}</p>`).join('')}</div>`}
if(active==='Evidence'){html=`<h2>Evidence explorer</h2><p class="muted">Low-confidence passages are candidates, not normalized contractual answers. Search by field, text, source layer or status.</p><input id="filter" placeholder="Search evidence, e.g. RSU or Substantial Detriment" style="width:100%"><div class="panel scroll" id="records"></div>`}
if(active==='Comparison'){html=`<h2>Summary and agreement comparison</h2><p class="muted">Conflicts block canonical values. Narrative similarity is not sufficient to establish a legal match.</p><div class="panel">${bundle.comparisons.map(c=>`<details><summary>${pretty(c.field_name)} ${badge(c.classification,c.classification==='unresolved'||c.classification==='conflict')}</summary><p>Canonical value: ${esc(c.canonical_value)}</p><h3>Filing summary</h3>${c.summary.filter(r=>r.evidence).slice(0,3).map(evidence).join('')||'No evidence found'}<h3>Underlying agreement</h3>${c.agreement.filter(r=>r.evidence).slice(0,3).map(evidence).join('')||'No evidence found'}</details>`).join('')}</div>`}
if(active==='Timeline'){html=`<h2>Timeline and contractual risk</h2><p class="notice">Dates in passages are candidates unless explicitly resolved. Conditional dates are not promised closing dates.</p><div class="panel">${bundle.timeline.map(e=>`<details><summary>${pretty(e.event)} ${badge(e.date_type,true)} ${esc(e.resolved_date||'')}</summary><p>Candidate dates: ${e.candidate_dates.map(x=>esc(x.iso)).join(', ')||'Relative or not found'}</p>${evidence(e.source)}</details>`).join('')}</div>`}
if(active==='Analytics'){const a=bundle.analytics;html=`<h2>Financing and hedge sensitivities</h2><p class="notice">Synthetic assumptions · ${esc(a.assumptions?.currency)} · Positive net cost is worse for the issuer. This is a first-order scenario model, not a trade quote.</p><div class="row"><label>Scenario <select id="scenario">${[...new Set((a.rows||[]).map(r=>r.scenario_id))].map(s=>`<option>${s}</option>`).join('')}</select></label></div><div id="scenario-table" class="panel"></div><div class="panel"><h3>Assumptions</h3><table>${Object.entries(a.assumptions||{}).map(([k,v])=>`<tr><th>${pretty(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table><h3>Adaptation</h3><pre style="white-space:pre-wrap">${esc(JSON.stringify(a.adaptation,null,2))}</pre><h3>Blocked scenarios</h3>${(a.blocked_scenarios||[]).map(x=>`<p>${pretty(x.scenario)}: ${esc(x.reason)}</p>`).join('')||'<p>None; extension anchors still require legal review.</p>'}<h3>Model limits</h3>${(a.limitations||[]).map(x=>`<p>${esc(x)}</p>`).join('')}</div>`}
if(active==='Ask DealLens'){html=`<h2>Grounded questions</h2><p>Ask about consideration, approvals, deadlines, fees, award treatment, financing or remedies. Unsupported answers return a clear refusal with candidate evidence for review.</p><div class="row"><input id="question" value="What is the consideration per share?" aria-label="Question"><button class="primary" id="ask">Ask</button></div><p><label><input id="strict" type="checkbox"> Require human-verified evidence</label></p><div id="answer"></div>`}
if(active==='Overview'){html=html.replace('This run uses deterministic rules; complex provisions remain in the review queue.','Unverified complex provisions remain in the review queue.');html+=`<div class="panel"><h3>Model and review controls</h3><p>Run mode: ${esc(manifest.mode||'deterministic baseline')}. Model proposals: ${esc(m.model_proposal_records??0)}. Verification counts do not imply complete legal review.</p><a href="/api/review-packet?run=${encodeURIComponent(manifest.run_id)}" download="review_packet.json">Download review packet</a><p class="muted">Inspect original sources, record explicit decisions and apply them with the CLI. Reviewer identity is self-attested; this browser is read-only.</p></div>`}
if(bundle.stale_source)html='<p class="notice">Source bytes have changed since this run. Answers and source viewing are blocked until the document is reingested.</p>'+html;
document.querySelector('#content').innerHTML=html;document.querySelector('#footer').textContent=`Run ${manifest.run_id} · Code ${manifest.code_version.slice(0,12)} · Public sources only · Read-only local application`;
if(active==='Evidence'){const draw=()=>{const q=document.querySelector('#filter').value.toLowerCase();document.querySelector('#records').innerHTML=bundle.extractions.filter(r=>r.evidence&&JSON.stringify(r).toLowerCase().includes(q)).map(evidence).join('')||'No matching evidence'};document.querySelector('#filter').oninput=draw;draw()}
if(active==='Analytics'){const draw=()=>{const rows=(bundle.analytics.rows||[]).filter(r=>r.scenario_id===document.querySelector('#scenario').value);document.querySelector('#scenario-table').innerHTML='<table><thead><tr><th>Strategy</th><th>Bond cost PV</th><th>Hedge receipt</th><th>Premium / fee</th><th>Delay cost</th><th>Net cost PV</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${pretty(r.strategy)}</td><td class="num">${fmt(r.bond_cost_pv)}</td><td class="num">${fmt(r.hedge_pnl)}</td><td class="num">${fmt(r.premium_or_fee)}</td><td class="num">${fmt(r.timing_cost)}</td><td class="num"><strong>${fmt(r.net_incremental_cost_pv)}</strong></td></tr>`).join('')+'</tbody></table>'};document.querySelector('#scenario').onchange=draw;draw()}
if(active==='Ask DealLens'){document.querySelector('#ask').onclick=async()=>{const q=document.querySelector('#question').value;const strict=document.querySelector('#strict').checked;const a=await(await fetch('/ask/'+encodeURIComponent(d.document_id)+'?q='+encodeURIComponent(q)+'&strict='+strict+'&run='+encodeURIComponent(manifest.run_id))).json();document.querySelector('#answer').innerHTML=`<div class="panel">${badge(a.status,true)} <h3>${esc(a.answer)}</h3><p>${esc(a.note||'')}</p>${(a.sources||[]).map(evidence).join('')}<h3>Candidate passages for review</h3>${(a.candidate_evidence||[]).map(evidence).join('')||'None'}</div>`}}
}
document.querySelector('#refresh').onclick=()=>location.reload();
(async()=>{try{manifest=await(await fetch('/api/manifest')).json();document.querySelector('#deal').innerHTML=manifest.documents.map(d=>`<option value="${esc(d.document_id)}">${pretty(d.document_id)}</option>`).join('');document.querySelector('#deal').onchange=load;await load()}catch(e){document.querySelector('#content').textContent='Could not load outputs. Run python -m deallens.cli run first.'}})();
</script></body></html>
